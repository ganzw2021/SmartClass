# SmartClass Nginx 配置 - 3000并发优化版
# 服务器路径: /etc/nginx/sites-available/smartclass
# 生效命令: sudo ln -sf /etc/nginx/sites-available/smartclass /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx

upstream smartclass_backend {
    server 127.0.0.1:5000;
    keepalive 64;  # 保持长连接，减少连接建立开销
}

server {
    listen 80;
    server_name jxzszyy.cloud _;

    # 字符编码
    charset utf-8;

    # ========== 静态资源优化 ==========
    # 开启 gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_disable "MSIE [1-6]\.";

    # 静态资源缓存（JS/CSS/图片等）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # 使用静态文件目录（如前端单独部署）
        # root /var/www/smartclass;

        # 缓存 1 年，利用 CDN 和浏览器缓存
        expires 1y;
        add_header Cache-Control "public, immutable";

        # 跨域资源共享
        add_header Access-Control-Allow-Origin "*";

        # 日志优化：不记录静态资源请求
        access_log off;
    }

    # ========== API 代理 ==========
    location /api/ {
        proxy_pass http://smartclass_backend;
        proxy_http_version 1.1;

        # 长连接
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时优化（考勤签到等场景需要更长超时）
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲区优化
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # 签到页面特殊处理（长等待）
        location /api/attendance/init_sign {
            proxy_read_timeout 30s;
        }
    }

    # ========== 二维码签到页面 ==========
    location /sign {
        proxy_pass http://smartclass_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        # 签到页面体积小，启用压缩
        proxy_set_header Accept-Encoding "";
    }

    # ========== 前端路由（支持 SPA） ==========
    location / {
        # 静态文件优先
        try_files $uri @proxy;

        # 缓存 index.html（用于版本控制）
        location = / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    location @proxy {
        # admin.html / teacher.html / student.html
        if ($request_filename ~* "^(.*admin.*\.html)$") {
            rewrite ^ /admin.html last;
        }
        if ($request_filename ~* "^(.*teacher.*\.html)$") {
            rewrite ^ /teacher.html last;
        }
        if ($request_filename ~* "^(.*student.*\.html)$") {
            rewrite ^ /student.html last;
        }
        proxy_pass http://smartclass_backend;
    }

    # ========== 日志配置 ==========
    access_log /var/log/nginx/smartclass_access.log combined buffer=16k flush=5s;
    error_log /var/log/nginx/smartclass_error.log warn;

    # ========== 安全头 ==========
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

